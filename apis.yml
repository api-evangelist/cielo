    title: Python SDK (API 3.0)
- aid: cielo:cielo-3ds-api
  name: Cielo 3DS 2.2 Authentication API
  tags:
  - 3D Secure
  - Authentication
  - Fraud Prevention
  - Card Not Present
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://mpi.braspag.com.br
  humanURL: https://developercielo.github.io/manual/3ds
  description: >-
    Cielo 3DS 2.2 is an EMVCo-compliant cardholder authentication service exposed via the Braspag MPI endpoint. It
    confirms that the buyer is the legitimate cardholder for card-not-present transactions on Visa, Mastercard, Elo, and
    Amex. Integrators call POST /v2/auth/token for a bearer token, then submit transactions through POST /1/sales using
    the ExternalAuthentication node (Cavv, Xid, ECI, Version, ReferenceID). Successfully authenticated transactions shift
    chargeback liability to the issuer.
  properties:
  - url: https://developercielo.github.io/manual/3ds
    type: Documentation
  - url: https://mpisandbox.braspag.com.br
    type: Sandbox
