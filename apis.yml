  description: >-
    The Cielo Payment Link API lets merchants generate short, shareable payment URLs for sale on social media, WhatsApp,
    SMS, or email without a full storefront. Authentication uses OAuth 2.0 client credentials encoded as Base64. Endpoints
    under /api/public/v1/products/ support creating, querying, updating, and deleting links, with /api/public/v2/orders/
    for transaction queries. Tokens expire after ~20 minutes and responses include a shortUrl plus a unique id and
    checkout order number.
