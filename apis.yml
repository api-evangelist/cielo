  description: >-
    Cielo Pix API exposes the Brazilian Central Bank's instant-payment rails on a Cielo-hosted endpoint. It implements
    OAuth 2.0 Client Credentials with mutual-TLS, certificate-bound access tokens, and an mTLS-required production host
    at api-mtls.cielo.com.br/cielo-pix/v1. Endpoints cover immediate charges (/cob), recurring charges (/cobr), recurring
    authorizations (/rec), refunds (/pix/{e2eid}/devolucao/{id}), and webhook configuration for receiving status events
    from the BCB Pix infrastructure.
