description: >-
  Cielo is one of the largest Brazilian card acquirers and a publicly traded company (B3:CIEL3), originally formed as a
  joint venture between Banco Bradesco and Banco do Brasil. The company processes credit, debit, Pix, QR Code, and boleto
  transactions for hundreds of thousands of merchants across Brazil, providing both in-person acquiring through its family
  of Cielo Smart (formerly LIO) Android POS terminals and Tap on Phone, and online payment processing through its e-Commerce
  API, Checkout, Payment Links, and Braspag gateway. Cielo exposes a broad developer surface through developercielo.github.io
  and the newer docs.cielo.com.br portal, including APIs for sales, queries, tokenization, 3DS 2.2 authentication, Pix
  with mTLS, chargeback management, refunds, reconciliation (Conciliador), and merchant promotions, along with open-source
  SDKs in Python, PHP, Java, C#, Kotlin, Swift, and Dart published from the DeveloperCielo GitHub organization.
