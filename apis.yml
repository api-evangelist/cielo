- type: Features
  data:
  - One of the largest Brazilian card acquirers, listed on B3 as CIEL3
  - Originally a joint venture of Banco Bradesco and Banco do Brasil
  - Accepts 80+ card brands, Pix, QR Code, NFC, and boleto
  - Family of Cielo Smart (formerly LIO) Android POS terminals (Flash, Smart)
  - SoftPOS via Cielo Tap (Tap on Phone) — no separate hardware
  - Online acquiring via Cielo e-Commerce API (Cielo API 3.0)
  - Hosted Cielo Checkout and Payment Links for low-code acceptance
  - 3DS 2.2 authentication via Braspag MPI with liability shift
  - Tokenization and recurring payments via the e-Commerce API
  - Pix via OAuth 2.0 with certificate-bound tokens and mTLS
  - Programmatic chargeback and refund lifecycle management
  - Financial reconciliation via Cielo Conciliador (F360-powered)
  - Promotion distribution to cardholders via Cielo Promo
  - Braspag-powered Gateway, Payment Split, and Risk Management
  - Pre-built connectors for major Brazilian e-commerce platforms
  - Open-source SDKs across Python, PHP, Java, C#, Kotlin, Swift, Dart
- type: UseCases
  data:
  - name: In-Person Card Acceptance
    description: >-
      Brick-and-mortar merchants accept credit, debit, Pix, and contactless payments through Cielo Smart Android POS
      terminals (formerly LIO) with local, deep-link, or remote integration.
  - name: SoftPOS / Tap on Phone
    description: >-
      Micro-entrepreneurs and field sales reps accept contactless card payments directly on their NFC-capable smartphones
      via Cielo Tap, without renting a dedicated POS device.
  - name: Online Card Acquiring
    description: >-
      E-commerce platforms use the Cielo e-Commerce API (API 3.0) to authorize, capture, void, and tokenize card
      transactions on Visa, Mastercard, Elo, Amex, Hipercard, and more.
  - name: Hosted Checkout and Payment Links
    description: >-
      Merchants with limited engineering capacity use Cielo Checkout or Payment Links to accept payments via shareable
      URLs on WhatsApp, Instagram, and SMS without building a storefront.
  - name: Pix Charges and Refunds
    description: >-
      Platforms generate immediate and recurring Pix charges, receive real-time settlement events via webhooks, and issue
      refunds through the Pix API with mTLS-secured access.
  - name: 3DS 2.2 Authentication
    description: >-
      Online merchants reduce chargeback exposure by routing card-not-present transactions through Cielo's Braspag MPI
      for liability-shifted authentication.
  - name: Dispute and Refund Management
    description: >-
      Operations teams query, accept, refuse, and document chargebacks and process refunds in bulk via dedicated APIs
      with letter-generation and evidence-download endpoints.
  - name: Financial Reconciliation
    description: >-
      Finance teams reconcile sales, fees, and settlement events using the Cielo Conciliador API (F360) to pull card and
      title installments, bank statements, and parameterised reports.
  - name: Recurring Payments and Tokenization
    description: >-
      Subscription businesses save card-on-file via Cielo's tokenization endpoints and bill on a recurring schedule
      with Zero Auth validation between charges.
  - name: Merchant Promotion Distribution
    description: >-
      Partner apps and fintechs surface enrolled merchant discounts to cardholders through the Cielo Promo API,
      retrieving promotion lists, establishment data, and cardholder transaction history.
- type: Integrations
  data:
  - name: Banco Bradesco
    description: Founding shareholder; Bradesco distribution channels onboard Cielo to their merchant base.
  - name: Banco do Brasil
    description: Founding shareholder; co-acquires and refers merchants from the Banco do Brasil network.
  - name: Braspag
