  description: >-
    The Cielo E-commerce API (also known as Cielo API 3.0) is the company's flagship online payment processing API. It
    accepts credit cards from Visa, Mastercard, Amex, Elo, Aura, JCB, Diners, Discover, and Hipercard, as well as debit
    cards with 3DS 2.2, Pix, boleto, QR Code, electronic transfer, and carne (installments). Authentication uses MerchantId
    and MerchantKey headers. Endpoints under /1/sales support authorization, capture, void, query, recurrence,
    tokenization, and Zero Auth validation, with separate transactional and query base URLs in sandbox and production.
  properties:
  - url: https://developercielo.github.io/manual/cielo-ecommerce
    type: Documentation
  - url: https://apisandbox.cieloecommerce.cielo.com.br
    type: Sandbox
